name: Validate Codeowners
on:
  workflow_dispatch:

  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-codeowners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Harden the runner (Block egress)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443

    - name: "Checkout source code at current commit"
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: step-security/codeowners-validator@073378e2c16714d69ac00356acebdb7505d82c7e # v0.7.4
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      name: "Full check of CODEOWNERS"
      with:
        checks: "syntax,duppatterns"
        github_access_token: "${{ secrets.GITHUB_TOKEN }}"
    - uses: step-security/codeowners-validator@073378e2c16714d69ac00356acebdb7505d82c7e # v0.7.4
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      name: "Syntax check of CODEOWNERS"
      with:
        checks: "syntax,duppatterns"
